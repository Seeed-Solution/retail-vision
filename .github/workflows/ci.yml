name: ci

# Everything here runs on a plain CPU runner. The accelerator backends need
# hardware that GitHub does not have, so what CI can honestly check is the part
# that is shared: the contract, and the logic that sits above detect().
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-py:
    name: core-py (shared logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install numpy pytest

      # The tracker fixture is the cross-implementation check: 330 frames with
      # expectations derived from the C++ authority rather than recorded from
      # this port, so a drift in either direction fails here.
      - name: Behaviour fixture
        run: python -m pytest core-py/retail_core/tests -q

      # A backend that imports the wrong thing at module scope breaks every
      # board at once. The RK image carries no OpenCV at all, so the cv2 video
      # source has to stay importable without it.
      - name: retail_core imports without OpenCV
        run: |
          cd core-py
          python - <<'PY'
          import sys, importlib
          sys.modules["cv2"] = None          # any import cv2 now raises
          import retail_core.video as video
          print("sources:", video.available_sources())
          assert "gstreamer_soft" in video.available_sources()
          PY

  core-cpp:
    name: core-cpp (shared logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiles and runs the same object code the boards run. Covers the
      # letterbox correction, which is where a coordinate bug hides silently:
      # it produces plausible-looking boxes that are simply in the wrong place.
      - name: Self-test
        run: |
          c++ -std=c++17 -Wall -Icore-cpp tools/core_selftest.cpp core-cpp/*.cpp -o /tmp/core_selftest
          /tmp/core_selftest

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Schema parses
        run: python -c "import json; json.load(open('contracts/vision-payload.schema.json'))"

      # Both directions: a validator that accepts everything passes the first
      # check and is worthless. The invalid fixture holds one wrong slot index
      # and one unknown dwell state, and the run must fail on it.
      - name: Validator accepts conforming payloads
        run: python3 contracts/validate_payload.py contracts/fixtures/valid.jsonl

      - name: Validator rejects broken payloads
        run: |
          if python3 contracts/validate_payload.py contracts/fixtures/invalid.jsonl; then
            echo "::error::validator accepted payloads it should have rejected"
            exit 1
          fi

  compose:
    name: compose files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a broken mount path or a stray tab before someone discovers it
      # on a board with no screen attached.
      - name: docker compose config
        run: |
          for f in backend/docker-compose.yml boards/*/docker-compose.yml; do
            echo "--- $f"
            STREAMS=placeholder docker compose -f "$f" config -q
          done

  # BASE-1 (vision-base): native core + Python orchestration layer + the
  # §10.5 hot-path lint. Everything here is the shared CPU platform; the
  # accelerated backends need hardware and are validated on the fleet.
  vision-base:
    name: vision-base (core-cpp + vision_base + hotpath lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config build-essential \
            libturbojpeg0-dev libssl-dev

      - name: ONNX Runtime 1.20.1 (x64, sha256 pinned)
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz
          echo "67db4dc1561f1e3fd42e619575c82c601ef89849afc7ea85a003abbac1a1a105  /tmp/ort.tgz" | sha256sum -c -
          sudo mkdir -p /opt/onnxruntime
          sudo tar -xzf /tmp/ort.tgz -C /opt/onnxruntime --strip-components=1

      # VB_BUILD_CPU (spec §8): native core + cpu backend, tests on.
      - name: Native build + ctest
        run: |
          cmake -S core-cpp/vb -B build/vb -DCMAKE_BUILD_TYPE=Release \
            -DVB_BACKENDS="cpu" -DVB_WITH_GST=OFF -DVB_WITH_JPEG=ON -DVB_WITH_TLS=ON \
            -DVB_TESTS=ON -DORT_ROOT=/opt/onnxruntime
          cmake --build build/vb -j"$(nproc)"
          ctest --test-dir build/vb --output-on-failure

      - name: Python tests
        run: |
          uv sync
          uv run pytest -q

      # §10.5 ① static guard: no per-frame computation in the Python layer.
      - name: Hot-path lint
        run: uv run python tools/vb_hotpath_lint.py --mode core core-py/vision_base
