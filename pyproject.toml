[project]
name = "retail-vision"
version = "0.1.0"
requires-python = ">=3.10"
# vision_base is owned by the vision-base distribution (core-py/pyproject.toml);
# this wheel ships retail_core only. pip resolves vision-base from its release
# tag (it is not on PyPI); uv uses the [tool.uv.sources] path below instead.
dependencies = [
    "vision-base @ git+https://github.com/Seeed-Solution/retail-vision@vision-base-v0.1.0#subdirectory=core-py",
]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.17,<5", "onnx>=1.16,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "core-py" }
packages = ["retail_core"]

[tool.uv.sources]
vision-base = { path = "core-py", editable = true }

[tool.pytest.ini_options]
testpaths = ["core-py", "tests"]
markers = ["native: needs VB_RUNTIME_BIN", "broker: needs a real MQTT broker (VB_TEST_BROKER=host:port)"]
